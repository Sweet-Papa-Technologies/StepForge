[package]
name = "stepforge-desktop"
version = "0.1.0"
description = "StepForge — turn any song into StepMania / ITGmania dance charts"
authors = ["Sweet Papa Technologies"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it wouldn't conflict with the
# bin name (an issue on Windows — see rust-lang/cargo#8519).
name = "stepforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-clipboard-manager = "2.3.2"

